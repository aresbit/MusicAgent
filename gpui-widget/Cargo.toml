[package]
name = "musicagent-widget"
version = "0.1.0"
edition = "2021"
description = "MusicAgent - GPUI desktop widget inspired by Claudio FM"

[dependencies]
gpui = "0.2"
gpui-component = "0.5"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
